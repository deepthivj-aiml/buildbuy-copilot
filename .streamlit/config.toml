# BuildBuy Copilot — Streamlit theme (warm brown).
# Read by Streamlit Community Cloud from the repo root on deploy.
# The in-app custom CSS in frontend/theme.py builds on this palette;
# keep the two in sync (primary #7C4A21, text #2E1F14, page #FBF6EF).
[theme]
primaryColor = "#7C4A21"
backgroundColor = "#FBF6EF"
secondaryBackgroundColor = "#F3E8D8"
textColor = "#2E1F14"
font = "sans serif"
