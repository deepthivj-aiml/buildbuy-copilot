# BuildBuy Copilot — Streamlit theme (light, indigo primary).
# Read by Streamlit Community Cloud from the repo root on deploy.
# The in-app custom CSS in frontend/theme.py builds on this palette;
# keep the two in sync (primary #4F46E5, text #1F2937, page #F8F7FF).
[theme]
primaryColor = "#4F46E5"
backgroundColor = "#F8F7FF"
secondaryBackgroundColor = "#EEF2FF"
textColor = "#1F2937"
font = "sans serif"
